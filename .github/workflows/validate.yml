name: Validate the action
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check generate.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -c "import yaml; yaml.safe_load(open('action.yml')); print('action.yml is valid YAML')"
